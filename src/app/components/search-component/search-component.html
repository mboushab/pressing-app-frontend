<div class="relative w-full">
  <mat-icon class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"
    >search</mat-icon
  >
  <input
    type="search"
    [placeholder]="placeholder()"
    [attr.aria-label]="placeholder()"

  />
</div>
