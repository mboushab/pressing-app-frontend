<form [formGroup]="userForm" (ngSubmit)="createUser()" class="space-y-4">
  <div>
    <label for="new-username" [class]="classNames.label">{{ 'login.username' | t }}</label>
    <input
      id="new-username"
      type="text"
      autocomplete="off"
      formControlName="username"
      [class]="classNames.input"
      autofocus
    />
    @if (userForm.controls.username.invalid && userForm.controls.username.touched) {
      <p [class]="classNames.fieldError">{{ 'clients.name_error' | t }}</p>
    }
  </div>
  <div>
    <label for="new-password" [class]="classNames.label">{{ 'login.password' | t }}</label>
    <input
      id="new-password"
      type="password"
      autocomplete="new-password"
      formControlName="password"
      [class]="classNames.input"
    />
    @if (userForm.controls.password.invalid && userForm.controls.password.touched) {
      <p [class]="classNames.fieldError">{{ 'users.password_error' | t }}</p>
    }
  </div>
  <fieldset>
    <legend [class]="classNames.label">{{ 'users.role' | t }}</legend>
    <div class="grid grid-cols-2 gap-2">
      <label
        class="flex cursor-pointer items-start gap-2 rounded-lg border border-slate-300 bg-white p-3 has-[:checked]:border-cyan-700 has-[:checked]:ring-1 has-[:checked]:ring-cyan-700"
      >
        <input type="radio" value="USER" formControlName="role" class="mt-1" />
        <span>
          <span class="block font-medium">{{ 'users.role.employee' | t }}</span>
          <span class="block text-xs text-slate-500">{{ 'users.role.employee_hint' | t }}</span>
        </span>
      </label>
      <label
        class="flex cursor-pointer items-start gap-2 rounded-lg border border-slate-300 bg-white p-3 has-[:checked]:border-cyan-700 has-[:checked]:ring-1 has-[:checked]:ring-cyan-700"
      >
        <input type="radio" value="ADMIN" formControlName="role" class="mt-1" />
        <span>
          <span class="block font-medium">{{ 'users.role.admin' | t }}</span>
          <span class="block text-xs text-slate-500">{{ 'users.role.admin_hint' | t }}</span>
        </span>
      </label>
    </div>
  </fieldset>
  @if (error(); as err) {
    <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ err | t }}</p>
  }
  <div class="flex justify-end gap-2">
    <button type="button" [class]="classNames.buttonSecondary" (click)="cancelled.emit()">
      {{ 'common.cancel' | t }}
    </button>
    <button type="submit" [class]="classNames.buttonPrimary" [disabled]="saving()">
      {{ (saving() ? 'common.saving' : 'users.create') | t }}
    </button>
  </div>
</form>
