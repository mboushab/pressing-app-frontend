<header class="sticky top-0 z-30 bg-slate-800 text-white shadow">
  <div class="max-w-6xl mx-auto flex flex-wrap md:flex-nowrap items-center gap-x-4 gap-y-2 px-4 py-3">
    <a routerLink="/app/home" class="flex shrink-0 items-center gap-2" aria-label="My clean app, dashboard">
      <mat-icon class="text-cyan-300">local_laundry_service</mat-icon>
      <span class="font-semibold text-lg leading-tight">My clean app</span>
      <span class="hidden xl:inline text-sm text-slate-400">· 33 38 36 13</span>
    </a>

    <div class="ml-auto flex shrink-0 items-center gap-2 md:order-last">
      <span class="hidden xl:flex items-center gap-1 text-sm text-slate-300">
        <mat-icon class="!text-lg !size-5">account_circle</mat-icon>
        {{ username }}
        @if (isAdmin) {
          <span class="rounded bg-cyan-700 px-1.5 py-0.5 text-[10px] font-semibold uppercase">admin</span>
        }
      </span>
      <button
        type="button"
        class="inline-flex items-center gap-1 rounded-lg px-2.5 py-1.5 text-sm text-slate-300 cursor-pointer hover:bg-white/10 hover:text-white"
        aria-label="Logout"
        (click)="onLogout()"
      >
        <mat-icon class="!text-lg !size-5">logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>

    <nav class="order-last flex w-full gap-1 overflow-x-auto [scrollbar-width:none] md:order-none md:w-auto md:flex-1">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-white/15 text-white"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white"
        >
          <mat-icon class="!text-lg !size-5">{{ link.icon }}</mat-icon>
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>
