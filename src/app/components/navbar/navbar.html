<div class="bg-slate-600 border-gray-300 pb-4 h-24 flex items-center justify-center">
  <h1 class="text-2xl font-bold text-zinc-50 text-center">My clean app: 33 38 36 13</h1>
</div>
<div class="bg-slate-500 h-20 pt-2.5 text-center">
  <nav>
    <a
      routerLink="/app/home"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-md px-3 py-1 font-medium text-gray-300 cursor-pointer hover:bg-white/20 hover:text-white"
    >
      Home</a
    >
    <a
      routerLink="/app/invoices"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-md px-3 py-1 font-medium text-gray-300 cursor-pointer hover:bg-white/20 hover:text-white"
      >Invoices</a
    >
    <a
      routerLink="/app/clothes"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-md px-3 py-1 font-medium text-gray-300 cursor-pointer hover:bg-white/20 hover:text-white"
      >Clothes</a
    >
    <a
      routerLink="/app/clients"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      class="rounded-md px-3 py-1 font-medium text-gray-300 cursor-pointer hover:bg-white/20 hover:text-white"
      >Clients</a
    >
    @if (userService.getUserRole().toLowerCase() === 'admin') {
      <a
        routerLink="/app/users"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md px-3 py-1 font-medium text-gray-300 cursor-pointer hover:bg-white/20 hover:text-white"
        >Users</a
      >
    }
  </nav>

  <button
    class="absolute flex gap-1 right-2.5 top-2.5 bg-red-600 border-none rounded-md px-3 py-1 font-medium text-gray-300 cursor-pointer hover:bg-red-700 hover:text-white"
    (click)="onLogout()"
  >
    <mat-icon class="text-gray-300">logout</mat-icon>
    <span>logout</span>
  </button>
</div>
