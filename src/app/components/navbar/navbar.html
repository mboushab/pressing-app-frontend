<header class="sticky top-0 z-30 bg-slate-800 text-white shadow">
  <div class="max-w-6xl mx-auto flex flex-wrap md:flex-nowrap items-center gap-x-4 gap-y-2 px-4 py-3">
    <a
      routerLink="/app/home"
      class="flex shrink-0 items-center gap-2"
      [attr.aria-label]="'app.name' | t"
    >
      <mat-icon class="text-cyan-300">local_laundry_service</mat-icon>
      <span class="font-semibold text-lg leading-tight">{{ 'app.name' | t }}</span>
      <span class="hidden xl:inline text-sm text-slate-400" dir="ltr">· 33 38 36 13</span>
    </a>

    <div class="ms-auto flex shrink-0 items-center gap-1 md:order-last">
      <span class="hidden xl:flex items-center gap-1 text-sm text-slate-300 me-1">
        <mat-icon class="!text-lg !size-5">account_circle</mat-icon>
        {{ username }}
        @if (isAdmin) {
          <span class="rounded bg-cyan-700 px-1.5 py-0.5 text-[10px] font-semibold uppercase">{{
            'users.role.admin' | t
          }}</span>
        }
      </span>
      <app-lang-switch [dark]="true" />
      <button
        type="button"
        class="inline-flex items-center gap-1 rounded-lg px-2.5 py-1.5 text-sm text-slate-300 cursor-pointer hover:bg-white/10 hover:text-white"
        [attr.aria-label]="'nav.logout' | t"
        [title]="'nav.logout' | t"
        (click)="onLogout()"
      >
        <mat-icon class="!text-lg !size-5 rtl:-scale-x-100">logout</mat-icon>
        <span class="hidden sm:inline">{{ 'nav.logout' | t }}</span>
      </button>
    </div>

    <nav
      class="order-last flex w-full gap-1 overflow-x-auto [scrollbar-width:none] md:order-none md:w-auto md:flex-1"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-white/15 text-white"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-1.5 whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white"
        >
          <mat-icon class="!text-lg !size-5 max-lg:!hidden">{{ link.icon }}</mat-icon>
          {{ link.label | t }}
        </a>
      }
    </nav>
  </div>
</header>
